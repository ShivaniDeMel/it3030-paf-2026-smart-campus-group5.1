spring.application.name=backend

# Server Configuration
server.port=8080

# MongoDB Configuration
spring.mongodb.uri=mongodb+srv://admin:PAF123@cluster0.xe6gwon.mongodb.net/smart_campus?appName=Cluster0

# Logging Configuration
logging.level.com.smartcampus=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.boot.mongodb=DEBUG

# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000

# Frontend redirect URL for OAuth success
app.frontend-url=http://localhost:5173

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true